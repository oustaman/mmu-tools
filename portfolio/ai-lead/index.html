<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI in the open: Faculty AI Lead, expression of interest</title>
<meta name="description" content="A narrated, trilingual five-slide expression of interest for Faculty Lead for AI in Education, Manchester Metropolitan University.">
<style>
  /* Tokens follow the Screen Design module pages, darkened or lightened only as
     far as WCAG AAA needs: every text colour here is at least 7:1 against every
     surface it sits on, in both themes. Everything is inline: the deck must work
     from a download as well as from GitHub Pages. */
  :root{
    --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#EDEBE8;
    --ink:#1A1618; --ink-2:#514B4A; --ink-3:#514B4B;
    --line:#DFDBD7; --line-2:#8E8685;
    --lec:#8C2437; --lec-soft:#F6E8EA;
    --wsh:#1A536E; --wsh-soft:#E4EEF3;
    --hnd:#285638; --hnd-soft:#E3EFE7;
    --warn:#794207; --warn-soft:#FBEFDF;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    --fs:1;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#151314; --surface:#1E1B1C; --surface-2:#262223;
    --ink:#EDE9E7; --ink-2:#B9B2AF; --ink-3:#B3ADAC;
    --line:#332E2F; --line-2:#7A7372;
    --lec:#E69FAD; --lec-soft:#332226;
    --wsh:#7FBEDC; --wsh-soft:#16262E;
    --hnd:#83C19A; --hnd-soft:#1C2A22;
    --warn:#F0B26B; --warn-soft:#33260F;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{font-size:calc(var(--fs) * 16px)}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  a{color:var(--lec)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--lec);outline-offset:2px;border-radius:6px}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

  /* ---------- bar ---------- */
  header{border-bottom:1px solid var(--line);background:var(--surface);flex:none;position:relative;z-index:20}
  .bar{max-width:1240px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{font-weight:680;letter-spacing:-.015em;white-space:nowrap;margin-right:auto}
  .brand small{font-family:var(--mono);font-size:.72rem;font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:.02em}
  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  /* every control is at least 44 × 44 px: WCAG 2.5.5, target size (AAA) */
  .btn{font-family:var(--mono);font-size:.78rem;background:var(--surface);color:var(--ink-2);
    border:1px solid var(--line-2);border-radius:8px;padding:0 12px;min-height:44px;min-width:44px;cursor:pointer;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
  .btn:hover{border-color:var(--lec);color:var(--lec)}
  .btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--surface);color:var(--ink-2);min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;font-size:.84rem}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .caution{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px;border-radius:8px;
    border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:650;font-size:.88rem}
  .caution::before{content:"⚠";font-size:1rem}

  /* ---------- calls to action: anything that leaves the deck ---------- */
  .cta{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;
    background:var(--ink);color:var(--bg);font-weight:620;font-size:.92rem;text-decoration:none;border:2px solid var(--ink);
    align-self:flex-start;white-space:nowrap}
  .cta:hover{background:var(--lec);border-color:var(--lec);color:var(--bg)}
  .cta.alt{background:transparent;color:var(--ink)}
  .cta.alt:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta.big{min-height:52px;padding:10px 22px;font-size:1rem;white-space:normal;line-height:1.3;background:var(--lec);border-color:var(--lec);color:#fff}
  :root[data-theme="dark"] .cta.big{color:#151314}
  .cta.big:hover{filter:brightness(1.1)}
  .cta svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- stage ---------- */
  main{flex:1;min-height:0;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;overflow-y:auto;padding:26px 20px 100px;opacity:0;visibility:hidden;transition:opacity .25s}
  .slide.on{opacity:1;visibility:visible}
  .inner{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--lec);margin:0 0 10px}
  h1,h2{letter-spacing:-.028em;line-height:1.08;margin:0 0 14px;font-weight:720}
  h1{font-size:clamp(2.6rem,7vw,5.4rem)}
  h2{font-size:clamp(1.6rem,3.6vw,2.6rem);max-width:24ch}
  .lede{font-size:clamp(1.1rem,2vw,1.45rem);color:var(--ink-2);max-width:36ch;margin:0 0 18px;line-height:1.4}
  .who{font-family:var(--mono);font-size:.8rem;color:var(--ink-3);margin:0 0 24px}
  .sub{color:var(--ink-2);max-width:78ch;margin:0 0 18px}
  .lit{box-shadow:0 0 0 3px var(--lec) !important;transition:box-shadow .2s}
  .frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 10px 30px -18px rgba(20,17,18,.45)}
  .frame .chrome{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .frame .chrome i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
  .frame .chrome span{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);margin-left:8px}
  .frame img{display:block;width:100%;height:auto;background:#fff}
  #dashImg{max-height:340px;object-fit:cover;object-position:top left}

  /* slide 1 */
  .hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:34px;align-items:center}
  .why{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px}
  .why h3,.work h3{margin:0 0 10px;font-size:.8rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:.92rem;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:9px 14px;min-height:44px;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-align:left}
  .chip:hover{border-color:var(--lec);color:var(--lec)}
  .chip .ok{color:var(--hnd);font-weight:700}
  .chip.lang{background:var(--lec-soft);border-color:var(--lec);color:var(--ink)}
  .chip.lang .ok{color:var(--lec)}
  .chip em{font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--ink-3)}
  .hint{font-size:.86rem;color:var(--ink-3);margin:10px 0 0}
  .star{font-size:.84rem;color:var(--ink-2);margin:12px 0 0}
  .aaa{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;max-width:60ch}
  .aaa b{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--hnd-soft);color:var(--hnd);
    border:1.5px solid var(--hnd);font-size:.82rem}
  .aaa span{font-size:.84rem;color:var(--ink-2);padding-top:3px}
  .work .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .work button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column}
  .work button:hover{border-color:var(--lec)}
  .work img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:#fff}
  .work button span{font-size:.82rem;padding:8px 10px;color:var(--ink);font-weight:600;border-top:1px solid var(--line)}
  .work .grid button:nth-child(odd){transform:rotate(-1.2deg)} .work .grid button:nth-child(even){transform:rotate(1deg) translateY(8px)}
  .work .grid button:hover{transform:none}

  /* slide 2 */
  .toggle{margin:0 0 16px;align-self:flex-start}
  .cards{display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;display:block;border-bottom:1px solid var(--line);background:#fff}
  .card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;color:var(--wsh);text-transform:uppercase}
  .card h3{margin:0;font-size:1.08rem;line-height:1.25;letter-spacing:-.01em}
  .side{font-size:.93rem;color:var(--ink-2);border-left:3px solid var(--wsh);padding:2px 0 2px 10px;margin:0}
  body[data-view="b"] .side{border-left-color:var(--hnd)}
  .side .vb{display:none} body[data-view="b"] .side .va{display:none} body[data-view="b"] .side .vb{display:inline}
  .quote{font-weight:650;font-size:.98rem;margin:0}
  .card .cta{margin-top:auto}
  .groups{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
  .grp > h3{margin:0 0 8px;font-family:var(--mono);font-size:.76rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
    display:flex;align-items:center;gap:10px}
  .grp > h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .grp .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grp.one .cards{grid-template-columns:1fr}

  /* slide 3 */
  .two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
  .conv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .conv .lab{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0}
  .in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .in label{font-weight:600;margin-right:4px}
  .in input[type=number]{width:96px;min-height:52px;font:inherit;font-size:1.6rem;font-weight:700;text-align:center;border:2px solid var(--ink);
    border-radius:10px;background:var(--bg);color:var(--ink);-moz-appearance:textfield}
  .in input::-webkit-inner-spin-button{display:none}
  .in .btn{min-width:52px;min-height:52px;font-size:1.3rem}
  .conv input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--lec)}
  .snap{font-family:var(--mono);font-size:.76rem;color:var(--ink-3);min-height:1.2em;margin:-6px 0 0}
  .out{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
  .out div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .out small{display:block;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
  .out b{display:block;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
  .out .sg{background:var(--lec-soft);border-color:var(--lec)}
  .out .sg b{font-size:2.4rem;line-height:1;color:var(--ink)}
  .out .sg small{color:var(--ink)}
  .conv .fine{margin:0;font-size:.86rem}
  .tools{display:grid;gap:12px}
  .tool{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
  .tool img{width:170px;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);background:#fff}
  .tool .ph{width:170px;aspect-ratio:16/10;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:2rem}
  .tool b{display:block;margin-bottom:2px;font-size:1.02rem}
  .tool .desc{display:block;font-size:.9rem;color:var(--ink-2);margin-bottom:10px}
  .tool .cta{min-height:44px;padding:0 14px;font-size:.84rem}

  /* slide 4 */
  .dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
  .nums{display:flex;gap:26px;flex-wrap:wrap;margin:12px 0 0}
  .nums div b{display:block;font-size:1.9rem;letter-spacing:-.025em;line-height:1.1}
  .nums div span{font-size:.84rem;color:var(--ink-2)}
  .rooms{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rooms h3{margin:0;padding:10px 14px;font-size:.8rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line)}
  .rt{width:100%;border-collapse:collapse;font-size:.9rem}
  .rt th{font-family:var(--mono);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);text-align:right;padding:8px 10px;background:var(--surface-2)}
  .rt th:first-child{text-align:left}
  .rt td{padding:0;border-top:1px solid var(--line)}
  .rt button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,.6fr));width:100%;min-height:44px;align-items:center;padding:0 10px;cursor:pointer}
  .rt button:hover{background:var(--surface-2)}
  .rt button:focus-visible{outline:3px solid var(--lec);outline-offset:-3px}
  .rt button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 5px 0 0 var(--lec);font-weight:600}
  .rt .n{text-align:right;font-variant-numeric:tabular-nums}
  .rt .x{color:var(--warn);font-weight:750}
  .rt .x::after{content:" ≠";font-weight:500}
  .rt small{display:block;font-size:.76rem;color:var(--ink-3)}
  .verdict{margin:0;padding:12px 14px;border-top:1px solid var(--line);font-weight:620}
  .verdict.bad{color:var(--warn);background:var(--warn-soft)} .verdict.ok{color:var(--hnd);background:var(--hnd-soft)}
  .measure{margin:16px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .measure div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--ink-2)}
  .measure div b{display:block;font-family:var(--mono);font-size:.72rem;color:var(--hnd);letter-spacing:.05em;margin-bottom:4px}
  .mhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:18px 0 0}
  .mhead h3{margin:0;font-size:1rem}
  .mhead p{margin:0;font-family:var(--mono);font-size:.76rem;color:var(--hnd)}

  /* slide 5 */
  .partners{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .partners span{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem}
  .with{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 8px}
  .repo{max-width:78ch;margin:0 0 20px;padding:12px 14px;border-left:3px solid var(--wsh);background:var(--wsh-soft);border-radius:0 8px 8px 0;color:var(--ink)}
  .ruler{position:relative;height:1.3em;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);margin:0 0 4px}
  .ruler span{position:absolute;top:0;white-space:nowrap}
  .phases{display:flex;gap:4px}
  .phases button{border:1px solid var(--line-2);background:var(--surface);padding:12px 14px;min-height:64px;text-align:left;cursor:pointer;font-weight:640;font-size:.94rem;border-radius:10px;position:relative;overflow:hidden}
  .phases button::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--wsh)}
  .phases button:nth-child(2)::before{background:var(--lec)} .phases button:nth-child(3)::before{background:var(--hnd)}
  .phases button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .phase-body{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:8px 0 0;color:var(--ink-2)}

  /* slide 6 */
  table.ai{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.88rem}
  table.ai th,table.ai td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.ai th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;background:var(--surface-2)}
  table.ai td:first-child{font-weight:650}
  table.ai tr:last-child td{border-bottom:0}
  .fine{color:var(--ink-2);font-size:.92rem;max-width:84ch;margin:10px 0 0}
  .part{margin:16px 0 8px;font-size:1rem;display:flex;align-items:center;gap:10px}
  .part::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .part:first-of-type{margin-top:0}
  .candid{margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--lec);background:var(--lec-soft);border-radius:0 8px 8px 0;color:var(--ink);max-width:84ch}
  .s6foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}

  /* ---------- player ---------- */
  .player{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
  .cap{max-width:900px;margin:0 auto 10px;padding:0 16px;text-align:center}
  .cap span{display:inline;background:rgba(20,17,18,.92);color:#fff;padding:5px 10px;border-radius:6px;font-size:1.05rem;line-height:1.7;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .cap:empty,.nocaps .cap{display:none}
  footer{flex:none;background:var(--surface);border-top:1px solid var(--line)}
  .foot{max-width:1240px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:8px}
  .play{min-width:130px;font-weight:600;white-space:nowrap}
  .prog{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:40px}
  .prog i{display:block;height:100%;width:0;background:var(--lec)}
  .count{font-family:var(--mono);font-size:.8rem;color:var(--ink-2);min-width:52px;text-align:center}
  .keys{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);max-width:1240px;margin:0 auto;padding:0 20px 6px}
  .dots{display:flex}
  .dots button{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
  .dots button::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--line-2)}
  .dots button[aria-current="true"]::after{background:var(--lec);width:12px;height:12px}
  .speed button{font-family:var(--mono);font-size:.78rem}
  .capShort{display:none}

  /* ---------- dialogs ---------- */
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 48px)}
  dialog::backdrop{background:rgba(20,17,18,.5)}
  .dh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
  .dh h2{font-size:1.05rem;margin:0;flex:1;letter-spacing:-.01em}
  .db{padding:14px 18px 20px}
  .ts h3{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--lec);margin:16px 0 6px}
  .ts h3:first-child{margin-top:0}
  .ts p{margin:0 0 6px}
  .ts button{border:0;background:none;padding:2px 3px;margin:-2px -3px;border-radius:4px;cursor:pointer;text-align:left;line-height:1.6}
  .ts button:hover{background:var(--lec-soft)}
  .ts button.now{background:var(--lec-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--lec)}
  .log{list-style:none;margin:10px 0 0;padding:0;font-size:.9rem}
  .log li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:96px 1fr;gap:10px}
  .log code{font-family:var(--mono);font-size:.76rem;color:var(--ink-3)}

<script src="content.js"></script>
<script>
(function () {
  const D = window.DECK;
  const $ = id => document.getElementById(id);
  const slides = [...document.querySelectorAll('.slide')];
  const audio = $('audio');
  const store = { get(k) { try { return localStorage.getItem('ailead-' + k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem('ailead-' + k, v); } catch (e) {} } };

  const qs = new URLSearchParams(location.search);
  let lang = qs.get('lang') || store.get('lang') || 'en';
  if (!D.langs[lang]) lang = 'en';
  let cur = 0, playing = false, cueIdx = -1;
  let rate = +(store.get('rate') || 1);
  const ui = k => (D.langs[lang].ui[k] ?? D.langs.en.ui[k] ?? '');

  $('pipe').textContent = D.pipeline || '';

  /* ---------- language ---------- */
  const HTMLLANG = { en: 'en-GB', es: 'es', zh: 'zh-Hans' };
  function applyLang() {
    document.documentElement.lang = HTMLLANG[lang] || lang;
    document.title = ui('doc_title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = ui(el.dataset.t); });
    // links that leave the deck say so to screen readers
    document.querySelectorAll('a[target="_blank"]').forEach(a => {
      let s = a.querySelector('.nt'); if (!s) { s = document.createElement('span'); s.className = 'sr nt'; a.appendChild(s); }
      s.textContent = ` (${ui('newtab')})`;
    });
    // Spanish and Mandarin carry a caution on every slide: machine translation, not checked by native speakers.
    slides.forEach(sl => {
      const inner = sl.querySelector('.inner'); let n = inner.querySelector(':scope > .caution');
      if (!ui('trans_note')) { if (n) n.remove(); return; }
      if (!n) { n = document.createElement('p'); n.className = 'caution'; n.setAttribute('role', 'note'); inner.prepend(n); }
      n.textContent = ui('trans_note');
    });
    $('langs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
    renderLangChips();
    setPlayUI();
    $('prev').setAttribute('aria-label', ui('prev')); $('next').setAttribute('aria-label', ui('next'));
    renderRooms(); renderPhase(curPhase); renderTranscript(); count();
    slides.forEach((s, i) => s.setAttribute('aria-label', `${i + 1} ${ui('counter_of')} ${slides.length}`));
  }
  Object.entries(D.langs).forEach(([k, L]) => {
    const b = document.createElement('button'); b.dataset.l = k; b.textContent = L.name + (k === 'en' ? '' : ' *');
    b.lang = HTMLLANG[k]; b.onclick = () => setLang(k); $('langs').appendChild(b);
  });
  function setLang(k) {
    const wasPlaying = playing; const t = audio.currentTime; stop();
    lang = k; store.set('lang', k); applyLang(); loadAudio();
    if (wasPlaying) play();
  }
  // Slide 1: one button per other language. It switches and starts the narration.
  function renderLangChips() {
    const box = $('langChips'); box.innerHTML = '';
    Object.keys(D.langs).filter(k => k !== lang).forEach(k => {
      const b = document.createElement('button'); b.className = 'chip lang'; b.dataset.at = '0-5';
      b.innerHTML = '<span class="ok" aria-hidden="true">▶</span>';
      const s = document.createElement('span'); s.textContent = ui('watch_' + k) + (k === 'en' ? '' : ' *'); b.appendChild(s);
      b.onclick = () => { setLang(k); go(cur); audio.currentTime = 0; play(); };
      box.appendChild(b);
    });
  }

  /* ---------- slides ---------- */
  function count() { $('count').textContent = `${cur + 1} ${ui('counter_of')} ${slides.length}`; }
  function go(n, keepPlaying) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    slides[cur].classList.remove('on'); cur = n; slides[cur].classList.add('on');
    slides[cur].scrollTop = 0;
    $('dots').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-current', i === cur));
    count(); clearLit(); $('cap').textContent = ''; cueIdx = -1;
    history.replaceState(null, '', location.search + `#${cur + 1}`);
    loadAudio();
    if (keepPlaying && track() && track().audio) play(); else if (!keepPlaying) stop();
  }
  slides.forEach((_, i) => {
    const b = document.createElement('button'); b.setAttribute('aria-label', String(i + 1)); b.onclick = () => go(i);
    $('dots').appendChild(b);
  });
  $('prev').onclick = () => go(cur - 1, playing);
  $('next').onclick = () => go(cur + 1, playing);
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));

  /* ---------- narration ---------- */
  function track() { return D.langs[lang].slides[cur]; }
  function loadAudio() {
    const t = track();
    if (t && t.audio) { if (!audio.src.endsWith(t.audio)) audio.src = t.audio; }
    else audio.removeAttribute('src');
    audio.defaultPlaybackRate = audio.playbackRate = rate;
    $('progBar').style.width = '0';
  }
  function play() {
    const t = track();
    if (!t || !t.audio) { stop(); return; }
    audio.playbackRate = rate;
    playing = true; audio.play().catch(() => { playing = false; setPlayUI(); }); setPlayUI();
  }
  function stop() { playing = false; audio.pause(); setPlayUI(); }
  function setPlayUI() { $('playIco').textContent = playing ? '❚❚' : '▶'; $('playLab').textContent = playing ? ui('pause') : ui('play'); $('play').setAttribute('aria-label', playing ? ui('pause') : ui('play')); }
  $('play').onclick = () => {
    if (playing) { stop(); return; }
    if (!track() || !track().audio) go(0);
    play();
  };
  audio.addEventListener('loadedmetadata', () => { audio.playbackRate = rate; });
  audio.addEventListener('timeupdate', () => {
    const t = track(); if (!t) return;
    $('progBar').style.width = (100 * audio.currentTime / (t.dur || 1)) + '%';
    const i = t.cues.findIndex(c => audio.currentTime >= c.t0 && audio.currentTime < c.t1 + 0.29);
    if (i !== cueIdx) { cueIdx = i; onCue(cur, i); }
  });
  audio.addEventListener('ended', () => {
    if (!playing) return;
    const next = D.langs[lang].slides[cur + 1];
    if (cur < slides.length - 1) go(cur + 1, !!(next && next.audio));
    if (!track() || !track().audio) stop();
  });

  /* speed */
  function setRate(r) {
    rate = r; store.set('rate', r); audio.defaultPlaybackRate = audio.playbackRate = r;
    $('speed').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === r));
  }
  $('speed').querySelectorAll('button').forEach(b => b.onclick = () => setRate(+b.dataset.r));
  setRate(rate);

  // What the narration does to the page, sentence by sentence.
  const ACTIONS = {
    '1-4': () => setView('b'),       // "It never passes. The decisions are what we mark."
    '2-3': () => setMark(68),        // "Choose a mark, and it gives the Singapore grade..."
    '3-3': () => pickRoom('104'),    // "...like room one-oh-four, here."
    '4-2': () => cyclePhases()       // "map, then pilot, then evaluate"
  };
  function clearLit() { document.querySelectorAll('.lit').forEach(e => e.classList.remove('lit')); }
  function onCue(s, i) {
    clearLit();
    const t = track();
    $('cap').innerHTML = '';
    if (i < 0 || !t) { markTranscript(-1, -1); return; }
    const sp = document.createElement('span'); sp.textContent = t.cues[i].text; $('cap').appendChild(sp);
    slides[s].querySelectorAll(`[data-at="${s}-${i}"]`).forEach(e => e.classList.add('lit'));
    const a = ACTIONS[`${s}-${i}`]; if (a) a();
    markTranscript(s, i);
  }

  $('capBtn').onclick = () => {
    const on = $('capBtn').getAttribute('aria-pressed') !== 'true';
    $('capBtn').setAttribute('aria-pressed', on); document.body.classList.toggle('nocaps', !on); store.set('caps', on ? '1' : '0');
  };
  if (store.get('caps') === '0') $('capBtn').click();

  /* ---------- transcript ---------- */
  function renderTranscript() {
    const b = $('tsBody'); b.innerHTML = '';
    D.langs[lang].slides.forEach((s, si) => {
      const h = document.createElement('h3'); h.textContent = `${si + 1} · ${slides[si].querySelector('h1,h2').textContent}`; b.appendChild(h);
      const p = document.createElement('p');
      s.cues.forEach((c, ci) => {
        const x = document.createElement('button'); x.textContent = c.text; x.dataset.k = `${si}-${ci}`;
        x.onclick = () => { $('tsDlg').close(); go(si); if (s.audio) { audio.currentTime = c.t0; play(); } };
        p.appendChild(x); p.appendChild(document.createTextNode(' '));
      });
      b.appendChild(p);
    });
  }
  function markTranscript(s, i) {
    $('tsBody').querySelectorAll('.now').forEach(e => e.classList.remove('now'));
    const e = $('tsBody').querySelector(`[data-k="${s}-${i}"]`); if (e) e.classList.add('now');
  }
  function openTs() { $('tsDlg').showModal(); }
  $('tsBtn').onclick = openTs; $('cTs').onclick = openTs;

  /* ---------- how this was made: the git log, live ---------- */
  let logLoaded = false;
  async function openMade() {
    $('madeDlg').showModal();
    if (logLoaded) return; logLoaded = true;
    const ul = $('log');
    try {
      const r = await fetch('https://api.github.com/repos/oustaman/mmu-tools/commits?path=portfolio&per_page=25');
      if (!r.ok) throw new Error(r.status);
      const cs = await r.json();
      if (!cs.length) throw new Error('empty');
      cs.forEach(c => {
        const li = document.createElement('li');
        const d = document.createElement('code'); d.textContent = c.commit.author.date.slice(0, 10) + ' ' + c.sha.slice(0, 7);
        const a = document.createElement('a'); a.href = c.html_url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = c.commit.message.split('\n')[0];
        li.appendChild(d); li.appendChild(a); ul.appendChild(li);
      });
    } catch (e) {
      $('logNote').textContent = 'The live log could not be read here (offline, or opened from a download). The full history is on GitHub:';
    }
  }
  $('madeBtn').onclick = openMade; $('cGit').onclick = openMade;
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

  /* ---------- slide 1 chips ---------- */
  const ua = navigator.userAgent;
  $('uaName').textContent = /Edg\//.test(ua) ? '· Edge' : /Firefox\//.test(ua) ? '· Firefox' : /Chrome\//.test(ua) ? '· Chrome' : /Safari\//.test(ua) ? '· Safari' : '';
  $('cBrowser').onclick = () => go(1);
  $('cPhone').onclick = () => { const on = document.body.classList.toggle('phone'); $('cPhone').setAttribute('aria-pressed', on); };

  /* ---------- slide 2 toggle ---------- */
  function setView(v) {
    document.body.dataset.view = v;
    $('view').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  }
  $('view').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));

  /* ---------- slide 3: stepped mark to Singapore grade ---------- */
  // The scale from my mark converter: [mark, UG classification, Singapore grade, NUS/NTU GPA]
  const SCALE = [[100,"Exceptional","A+","5.0"],[95,"","A+","5.0"],[90,"Outstanding","A+","5.0"],[85,"Very high 1st","A+","4.5"],[78,"High 1st","A","4.5"],[75,"Mid 1st","A","4.5"],[72,"Low 1st","A","4.0"],[68,"High 2.1","A-","4.0"],[65,"Mid 2.1","A-","4.0"],[62,"Low 2.1","B+","3.5"],[58,"High 2.2","B+","3.5"],[55,"Mid 2.2","B","3.0"],[52,"Low 2.2","B","3.0"],[48,"High 3rd","B-","3.0"],[45,"Mid 3rd","B-","2.5"],[42,"Low 3rd","C+","2.5"],[38,"Marginal fail","C","2.0"],[35,"","C","2.0"],[32,"","C-","2.0"],[28,"Clear fail","D+","1.5"],[25,"","D","1.5"],[22,"","D","1.5"],[18,"","D-","1.0"],[15,"","F","1.0"],[12,"","F","0.5"],[8,"Low fail","F","0.5"],[5,"","F","0.0"],[2,"","F","0.0"],[0,"Non-engagement","F","0.0"]];
  const ASC = SCALE.slice().reverse();              // index 0 = mark 0, for the slider
  let stepIdx = ASC.findIndex(r => r[0] === 68);
  function showStep(i, typed) {
    stepIdx = Math.max(0, Math.min(ASC.length - 1, i));
    const r = ASC[stepIdx];
    $('mark').value = typed != null ? typed : r[0]; $('markRange').value = stepIdx;
    $('markRange').setAttribute('aria-valuetext', String(r[0]));
    $('snap').textContent = typed != null && +typed !== r[0] ? `→ ${r[0]}` : '';
    $('oSg').textContent = r[2]; $('oGpa').textContent = r[3]; $('oCls').textContent = r[1] || '–';
  }
  function setMark(m) {
    m = Math.max(0, Math.min(100, Math.round(+m || 0)));
    // nearest step, ties to the higher mark: the same rule as snapToNearestBoundary() in the original tool
    let near = SCALE[0][0]; SCALE.forEach(r => { if (Math.abs(m - r[0]) < Math.abs(m - near)) near = r[0]; });
    showStep(ASC.findIndex(r => r[0] === near), m);
  }
  $('mark').addEventListener('input', e => { if (e.target.value !== '') setMark(e.target.value); });
  $('mark').addEventListener('change', () => showStep(stepIdx));
  $('markRange').addEventListener('input', e => showStep(+e.target.value));
  $('mUp').onclick = () => showStep(stepIdx + 1); $('mDown').onclick = () => showStep(stepIdx - 1);
  showStep(stepIdx);

  /* ---------- slide 4: Geoffrey Manton, first floor, as three records describe it ---------- */
  // From the Room Finder's reconciliation list (build of 9 September 2026).
  // sm = Space Management (Master Roomdata), tt = timetable capacity, deck = chairs on the layout drawing.
  const ROOMS = [
    ['101a', 'Computer Room', 37, null, null], ['104', 'Seminar Room', 40, 40, 45],
    ['111', 'Computer Lab', 30, 29, null], ['119', 'Computer Lab', 39, 38, null],
    ['120', 'Computer Lab', 19, 20, null]
  ];
  const disagree = r => [r[3], r[4]].some(v => v != null && v !== r[2]);
  let curRoom = '104';
  function renderRooms() {
    const tb = $('roomRows'); tb.innerHTML = '';
    ROOMS.forEach(r => {
      const tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = 4;
      const b = document.createElement('button'); b.dataset.room = r[0]; b.setAttribute('aria-pressed', r[0] === curRoom);
      const cell = v => `<span class="n${v != null && v !== r[2] ? ' x' : ''}">${v == null ? '–' : v}</span>`;
      b.innerHTML = `<span><b>GM ${r[0]}</b><small>${r[1]}</small></span><span class="n">${r[2]}</span>${cell(r[3])}${cell(r[4])}`;
      b.onclick = () => pickRoom(r[0]);
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
    });
    const r = ROOMS.find(x => x[0] === curRoom);
    $('verdict').className = 'verdict ' + (disagree(r) ? 'bad' : 'ok');
    $('verdict').textContent = `GM ${r[0]}: ` + (disagree(r) ? ui('s4_room_bad') : ui('s4_room_ok'));
  }
  function pickRoom(k) { curRoom = k; renderRooms(); }

  /* ---------- slide 5 phases ---------- */
  let curPhase = 1, phaseTimer = null;
  function renderPhase(p) {
    curPhase = p;
    $('phases').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', +b.dataset.p === p));
    $('phaseBody').textContent = ui('s5_ph' + p + 'b');
  }
  $('phases').querySelectorAll('button').forEach(b => b.onclick = () => { clearInterval(phaseTimer); renderPhase(+b.dataset.p); });
  function cyclePhases() {
    clearInterval(phaseTimer); renderPhase(1); let p = 1;
    phaseTimer = setInterval(() => { p++; if (p > 3) { clearInterval(phaseTimer); return; } renderPhase(p); }, 1700 / rate);
  }

  /* ---------- text size, theme, keys ---------- */
  let fs = +(store.get('fs') || 1);
  const setFs = v => { fs = Math.min(1.5, Math.max(0.8, Math.round(v * 10) / 10)); document.documentElement.style.setProperty('--fs', fs); store.set('fs', fs); };
  setFs(fs);
  $('fsUp').onclick = () => setFs(fs + 0.1); $('fsDown').onclick = () => setFs(fs - 0.1);
  const th = store.get('theme'); if (th) document.documentElement.dataset.theme = th;
  $('themeBtn').onclick = () => {
    const dark = document.documentElement.dataset.theme === 'dark';   // light by default; dark only when chosen
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme);
  };
  document.addEventListener('keydown', e => {
    if (document.querySelector('dialog[open]') || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1, playing); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1, playing); }
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') { e.preventDefault(); $('play').click(); }
    else if (e.key.toLowerCase() === 't') openTs();
    else if (e.key.toLowerCase() === 'c') $('capBtn').click();
  });
  let sx = null;
  $('stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1), playing);
  });

  window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) go(n - 1); });
  applyLang();
  const start = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  slides[start].classList.add('on'); cur = start; go(start);
})();
</script>
</body>
</html>
