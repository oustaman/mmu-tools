<!doctype html>
<html lang="en-GB">
<head>

<title>Workshop slides — Screen Design</title>
<link rel="stylesheet" href="deck-kit.css?v=202611162245">
<style>


  /* the workshop slides: four per week, the same in every room */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;padding:0;list-style:none}
  .chips li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:clamp(0.92rem,1.3vw,1.04rem);color:var(--ink-2)}
  .chips b{font-family:var(--mono);color:var(--ink);margin-right:6px}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin:0 0 12px}
  .shots figure{margin:0}
  .shots img{display:block;width:100%;height:auto;max-height:calc(100vh - 330px);object-fit:contain;object-position:left top;border:1px solid var(--line);border-radius:6px;background:#fff}
  .shots figcaption{font-size:0.82rem;color:var(--ink-3);margin-top:5px}
  .exq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 0 12px;font-size:clamp(0.9rem,1.2vw,1rem);color:var(--ink-2);line-height:1.5;max-width:76ch}
  .exq h3{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  .exq p{margin:0} .exq pre{margin:0;white-space:pre-wrap;font:clamp(0.78rem,1.05vw,0.9rem)/1.5 var(--mono);color:var(--ink)} .exq dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 14px;margin:0} .exq dt{color:var(--ink-3)} .exq dd{margin:0}
  .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
  @media(max-width:860px){.duo{grid-template-columns:minmax(0,1fr)}}
  .tnote{margin:18px 0 0;max-width:760px;background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;font-size:0.86rem;color:var(--ink-2)}
  .tnote ul{margin:6px 0 0;padding-left:18px} .tnote li{margin:0 0 4px} .tnote b{color:var(--ink)} .tnote span{font-size:0.78rem;color:var(--ink-3)}
  html.present .tnote{display:none}
  .lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 14px}
  @media(max-width:760px){.lanes{grid-template-columns:minmax(0,1fr)}}
  .lane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:clamp(0.95rem,1.3vw,1.05rem);color:var(--ink-2);line-height:1.45}
  .lane h3{margin:0 0 6px;font-size:1.1rem;color:var(--ink)} .lane p{margin:0} .lane b{color:var(--ink)}
  .src{font-size:0.82rem;color:var(--ink-3);margin:0}
  .big-link{display:inline-block;font-weight:700;font-size:clamp(1rem,1.5vw,1.15rem)}
  .none-yet{color:var(--ink-3)}
  .fbgo{margin:6px 0 10px}
  .fbgo a{display:inline-flex;align-items:center;min-height:56px;padding:12px 28px;border-radius:12px;background:var(--lec);color:#fff;font-weight:700;font-size:clamp(1.1rem,1.8vw,1.4rem);text-decoration:none}
  html[data-theme="dark"] .fbgo a{color:#151314}
  .fburl{font-family:var(--mono);font-size:clamp(1rem,1.6vw,1.3rem);color:var(--ink);margin:0 0 14px;word-break:break-all}

  /* THE BAR — one definition, identical on every page (written by navfix; change it
     everywhere or nowhere). It used to be copied per page and drifted into two heights. */
  header.sdnav{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
  header.sdnav .bar{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px;flex-wrap:nowrap}
  header.sdnav .brand{font-weight:680;font-size:1rem;letter-spacing:-0.015em;white-space:nowrap;color:inherit;
    text-decoration:none;padding:5px 8px;margin-left:-8px;border-radius:6px;order:0}
  header.sdnav .brand:hover{background:var(--surface-2,var(--bg))}
  header.sdnav .sp{flex:1;display:block;height:auto;flex-basis:auto;order:0}
  header.sdnav .sdlinks{display:flex;align-items:center;gap:2px;order:0}
  header.sdnav .navl{display:inline-block;font-size:0.85rem;line-height:1.3;color:var(--ink-2);text-decoration:none;
    padding:6px 10px;border-radius:6px;white-space:nowrap;order:0}
  header.sdnav .navl:hover{background:var(--surface-2,var(--bg));color:var(--ink)}
  header.sdnav .navl.on{background:var(--lec);color:#fff}
  html[data-theme="dark"] header.sdnav .navl.on{color:#151314}
  header.sdnav a:focus-visible,header.sdnav button:focus-visible{outline:2px solid var(--lec);outline-offset:1px}
  header.sdnav .ctl{order:0;margin-left:4px}
  header.sdnav .fbl{order:0;display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--lec);
    color:#fff;font-size:0.86rem;font-weight:700;text-decoration:none;white-space:nowrap;margin-left:6px}
  header.sdnav .fbl[hidden]{display:none}
  header.sdnav .fbl:hover{filter:brightness(1.1)}
  html[data-theme="dark"] header.sdnav .fbl{color:#151314}
  .oldsw{text-align:center;font-size:0.82rem;color:var(--ink-3);margin:28px auto 32px;padding:0 16px}
  .oldsw a{color:var(--ink-2)}
  html.present .oldsw{display:none}
  header.sdnav .ctl button{font-family:var(--mono);font-size:0.7rem;background:none;color:var(--ink-3);
    border:1px solid var(--line-2);border-radius:6px;padding:0 9px;cursor:pointer;line-height:1;
    height:34px;min-height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center}
  header.sdnav .ctl button:hover{border-color:var(--lec);color:var(--lec)}
  @media(max-width:960px){
    header.sdnav .bar{flex-wrap:wrap;row-gap:0;padding-block:6px 0;min-height:0}
    header.sdnav .ctl{order:1;margin-left:auto}
    header.sdnav .fbl{order:1;margin-left:auto;min-height:34px;padding:5px 12px}
    header.sdnav .fbl:not([hidden]) ~ .ctl{margin-left:6px}
    header.sdnav .sp{display:none}
    header.sdnav .sdlinks{order:2;flex-basis:100%;overflow-x:auto;scrollbar-width:none;padding:4px 28px 8px 0;min-height:44px;
      -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
    header.sdnav .sdlinks::-webkit-scrollbar{display:none}
    header.sdnav .navl{font-size:0.82rem;padding:6px 9px}
  }
</style>
</head>

<header class="sdnav">
  <div class="wrap bar">
    <a class="brand" href="index.html">Screen Design</a>
    <span class="sp"></span>
    <nav class="sdlinks" aria-label="Screen Design"><a class="navl" href="start.html">Start here</a><a class="navl on" href="weeks.html">Week by week</a><a class="navl" href="assessment.html">Checklist</a><a class="navl" href="examples.html">Examples</a><a class="navl" href="toolkit.html">Toolkit</a><a class="navl" href="assessment-materials.html">Marking</a><a class="navl" href="all.html">All pages</a></nav>
    <a class="fbl" id="fbl" href="#" target="_blank" rel="noopener" hidden>Feedback form</a>

</header>
<script>(function(){var d=new Date(),a=document.getElementById("fbl");[["2026-11-16", "2026-11-30", "https://forms.cloud.microsoft/e/FkCJKpKu2d"], ["2026-11-30", "2026-12-14", "https://forms.cloud.microsoft/e/tSchWyEaBF"]].forEach(function(f){if(f[2]&&d>=new Date(f[0]+"T00:00")&&d<new Date(f[1]+"T00:00")){a.href=f[2];a.hidden=false;}});var n=document.querySelector(".sdlinks"),o=n&&n.querySelector(".on");if(o&&n.scrollWidth>n.clientWidth)n.scrollLeft=o.offsetLeft-n.offsetLeft-16;})();</script>

<div class="dtools"><div class="wrap">
  <b id="dtitle">Workshop slides</b><span class="sp"></span>
  <select id="jump" aria-label="Go to slide"></select>
  <button type="button" class="tb" id="prev" aria-label="Previous slide">←</button>

<script>
(function () {
  /* Workshop slides for weeks 6 to 10: what we make today, where each student is, the steps, what the
     finished thing looks like, and what happens before you leave. The same in all three rooms, so nobody needs the
     lecture hour to start. The steps are the week page's, said shorter; the week page owns them. */
  const n = +(new URLSearchParams(location.search).get('w')) || 7;
  const W = WEEKS.find(w => w.n === n), SEC = Object.fromEntries(PARTS.flatMap(p => p.items).map(x => [x.sec, x]));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* a section of the council example, from its own data */
  const ex = sec => { const s = EXAMPLE.slides.find(x => x.sec === sec); if (!s) return '';
    return `<div class="exq">${s.blocks.map(b => b.t === 'h3' ? `<h3>${esc(b.x.replace(/\s+/g, ' '))}</h3>` : b.t === 'p' ? `<p>${esc(b.x)}</p>`
      : b.t === 'kv' ? `<dl>${b.x.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`
      : b.t === 'pre' ? `<pre>${esc(b.x)}</pre>` : '').join('')}</div>`; };
  const shot = (f, cap) => `<figure><img src="ws/${f}" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}</figcaption></figure>`;
  const SRC = '<p class="src">From the council example on <a href="examples.html">Examples</a>: a solid 2:1, invented by the module team.</p>';
  const D = {
    6: { h: 'How it will look and feel, and an honest AI log', secs: ['B2', 'B3', 'A7', 'C8'],
      lead: 'Today you decide how your screens will look and feel, using your own numbers from A3 to A5, and you start a record of any AI you use.',
      steps: ['Mood board: as many images as you need on one page, at least five or six, so it feels the way your design should feel. Generated images or your own photos, each with its source and a date, like November 2026. Buttons, stickies, colours: anything that helps the feel. You can’t go wrong.',
        'Style tile: build it in the <a href="gallery.html#tile">Gallery</a>. Pick a typeface and colours, change anything on the tile until you like it, then copy it into B3.',
        'Open A7, your AI log: one bullet for every time you use AI. Which tool, for what, and what did it give you? Not using AI? One line: No AI used.',
        'Write C8: about 70–90 words. Used AI? Was it any good, whose work is it, what did you change? Chose not to? Why, and what you did instead.'],
      example: `<div class="shots">${shot('council-B2.png', 'B2: the mood board')}${shot('council-B3.png', 'B3: the style tile, every value from A3 to A5')}</div>${SRC}`,
      last: { t: 'Before you leave', body: '<p class="lead">Next week there is an optional check-in: share your deck with Mike and fill in a short form, and he leaves feedback right in your deck.</p><p>If you want it, check your deck is in your shared folder before next Tuesday.</p>' } },
    7: { h: 'Your version, and designing for everyone', secs: ['A2', 'B4', 'A6', 'C7'],
      lead: 'Today you list the screens of your version, draw its flow, and make decisions so it works for people in hard situations, and from other cultures.',
      steps: ['In A2, list the screens of your version, each with a job in under ten words.',
        'In the <a href="flow.html">Flow maker</a>, press <b>Start from my “now”</b> and change it into your version. Copy <b>Both</b> into B4. Or draw it in <a href="https://app.diagrams.net/" target="_blank" rel="noopener">draw.io</a>.',
        'Open <a href="inclusive.html">Design for everyone</a>. Pick three people whose situation fits your service.',
        'For each, find the screen where it would be hard, and make one decision there. Copy the card into A6 and change the words to fit.',
        'C7: on the same page, pick one of <b>Different cultures, different habits</b> that is real for your service. Make the decision, copy the paragraph, change the words in brackets.'],
      example: `${ex('A6')}${SRC}`,
      fb: 'w7',
      last: { t: 'Before next week', body: '<p class="lead">Finish A6 and C7 if you ran out of time.</p><p>Bring your concept sketches from week 2: next week the one you circled becomes your first wireframe.</p>' } },
    8: { h: 'Every screen wireframed, the first ones finished', secs: ['B5', 'B6'],
      lead: 'Today every screen of your journey gets a wireframe, states included, and your most important screens get finished for real.',
      steps: ['For each screen: what does it look like empty, loading, and when something fails? Add the screens that are missing.',
        'Wireframe every screen still without one, starting from the concept sketch you circled in B1: on paper, in the <a href="screen-maker.html">Screen maker</a>, or in <a href="https://app.diagrams.net/" target="_blank" rel="noopener">draw.io</a>. No colour yet.',
        'Cover your labels and hand the set to a partner. Redraw any screen whose job they can’t name.',
        'Put the set in B5.',
        'Finish your most important screens with your grid, type and colours: one slide each in B6.'],
      example: `<div class="shots">${shot('council-B5.png', 'B5: the wireframes')}${shot('council-B6.png', 'B6: the first one, finished')}</div>${SRC}`,
      last: { t: 'Before next week', body: '<p class="lead">Finish as many screens as you can for B6. Week 9 is set aside for the rest.</p>' } },
    9: { h: 'Every screen finished', secs: ['B6', 'C5', 'C6', 'B7'],
      lead: 'Today every screen of your journey gets finished, and you write two short texts: C5 and C6.',
      steps: ['Every finished screen out, with the wireframes for the rest.',
        'Finish the rest, one screen per slide in B6. Check your three decisions from A6 are really on the screens.',
        'Write C5: about 70–90 words on the A6 decision that helps the most people. Each card on <a href="inclusive.html">Design for everyone</a> has a paragraph to copy and edit. A6 says what; C5 says why.',
        'Write C6: about 70–90 words naming one decision on your screens, such as data you chose not to ask for.',
        'Other screen sizes only if your journey needs them (B7). Decide what to remove, not what to shrink.'],
      example: `<div class="duo">${ex('C5')}${ex('C6')}</div>${SRC}`,
      fb: 'w9', fbLead: 'A second round: fill it in again, and Mike will look at your deck again.',
      last: { t: 'Before next week', body: '<p class="lead">Finish every screen for B6. Next week you link them into a prototype that clicks through.</p>' } },
    10: { h: 'Link it, and check it', secs: ['B8', 'D2', 'D3'],
      lead: 'Today your screens become a prototype that clicks through, and you show the before beside the after.',
      steps: ['Link every screen to the next, with a way back and a way out. That is B8.',
        'Export a PDF, open it, and click every link.',
        'Check every step in D2 has a reason, then put your two most changed screens before and after in D3.',
        'Read two C sections to a partner: does each describe, or defend? Fix the one that describes.',
        'If you can, start C9 (every source you cited) and D4 (your AI statement, from A7). Week 11 has no class.'],
      example: `<div class="shots">${shot('council-D3.png', 'D3: before and after, side by side')}</div>${SRC}`,
      last: { t: 'Before you go', body: '<p class="lead">Export the deck as a PDF, open it, and click every link. A link that works in PowerPoint can vanish in the PDF, and the PDF is what gets marked.</p><p class="try">Week 11 has no class. Mike is in the room to help anyone who comes. Hand in by Friday 8 January 2027, 21:00.</p>' } },
  };
  /* For whoever runs the room: what to say in two minutes, what to look for, and the snag that comes up.
     Shown on the page, hidden in Present, so a tutor can read it once before the session and nothing more. */
  const TUTOR = {
    6: ['Say: today is how the screens will look and feel (B2 mood board, B3 style tile), plus the AI log (A7, C8). Not using AI is fine: C8 says why.',
      'Look for: a style tile whose sizes and colours match the student’s own A3 to A5. No A3 to A5 yet? That is the behind group: the Gallery fills all three, and builds the style tile.',
      'Snag: the mood board eating the session. Five or six images is enough; twenty minutes, then move on.'],
    7: ['Say: list the screens of your version, draw its flow, then make three decisions for people in hard situations (A6) and one for another culture (C7), all from the Design for everyone page.',
      'Look for: real people in real situations (one hand free, a second language, worry), each with one decision on a named screen.',
      'Snag: “accessible for everyone”. Ask: for whom, in what situation, and what on the screen helps them?',
      'Mention: the feedback form, on its own slide near the end. Optional; Mike gives feedback in their deck.'],
    8: ['Say: every screen as a wireframe, states included, then finish the most important ones for real.',
      'Look for: finished screens that use the student’s own A3 to A5 values, not new ones picked on the day.',
      'Snag: decorated wireframes. Boxes, labels and real words; colour belongs in B6.'],
    9: ['Say: finish every screen, then two short texts: C5 (why the best A6 decision matters, on its finished screen) and C6 (one ethics or sustainability decision).',
      'Look for: the three A6 decisions visible on the finished screens.',
      'Mention: the feedback form, on its own slide near the end, for a second round of feedback.'],
    10: ['Say: link the screens into a prototype, check it in the PDF, and show the before beside the after.',
      'Look for: every screen linked forward, with a way back and a way out.',
      'Snag: links that work in PowerPoint and vanish in the PDF. Everyone exports and clicks before leaving.'],
  };
  /* for the students who are ahead: the next useful thing, so nobody waits */
  const AHEAD = {
    6: 'Start week 7: list the screens of your version in A2, and give each one a job.',
    7: 'Start week 8: the states check, then wireframe the rest of your screens.',
    8: 'Start week 9: once a screen is finished, check your A6 decisions are on it, and start C5.',
    9: 'Start week 10: link your screens into a click-through.',
    10: 'Finish C9 and D4, then export the final PDF and click every link one last time.',
  };
  const d = D[n];
  if (!W || !d) { document.getElementById('deck').innerHTML = '<section class="sl"><div class="wrap"><h2>No workshop slides for this week</h2><p class="lead">There are slides for weeks 6 to 10. <a href="weeks.html">Week by week</a></p></div></section>'; DK.start(); return; }
  const date = SD.fmt(SD.dateOf(n)), when = `Week ${n} · ${SD.DAY} ${date}`;
  document.title = `Week ${n} workshop — Screen Design`;
  document.getElementById('dtitle').textContent = `Week ${n} workshop`;
  document.querySelectorAll('header.sdnav a.navl[href^="weeks.html"]').forEach(a => { a.href = 'weeks.html?w=' + n; });
  document.getElementById('deck').innerHTML = `
<section class="sl" data-t="Today"><div class="wrap">
  <p class="ey">${esc(when)} · workshop</p>
  <h2>${esc(d.h)}</h2>
  <p class="lead">${d.lead}</p>
  <ul class="chips">${d.secs.map(s => `<li><b>${s}</b>${esc(SEC[s].t)}</li>`).join('')}</ul>
  ${TUTOR[n] ? `<div class="tnote"><b>For tutors</b> <span>(hidden when you press Present)</span><ul>${TUTOR[n].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
</div></section>
<section class="sl" data-t="Where are you?"><div class="wrap">
  <h2>Where are you?</h2>
  <p class="lead">Everyone is at a different point, and that is fine. Pick the one that fits you today.</p>
  <div class="lanes">
    <div class="lane"><h3>Behind</h3><p>Open the <a href="assessment.html">checklist</a> and check what you can do today.</p></div>
    <div class="lane"><h3>On track</h3><p>Today’s steps are on the next slide.</p></div>
    <div class="lane"><h3>Ahead</h3><p>${esc(AHEAD[n] || 'Carry on with the next section on the checklist.')}</p></div>
  </div>
  <p class="src">Stuck on anything? Ask your tutor now, or bring it to Workshop 2, 14:00–16:00.</p>
</div></section>
<section class="sl" data-t="Do this"><div class="wrap">
  <h2>Do this</h2>
  <ol class="pts">${d.steps.map(s => `<li>${s}</li>`).join('')}</ol>
  <p class="src">Every step in full, with what to do when you are stuck: <a href="weeks.html?w=${n}#workshop">week ${n}</a>.</p>
</div></section>
<section class="sl" data-t="The finished thing"><div class="wrap">
  <h2>What the finished thing looks like</h2>
  ${d.example}
</div></section>
${d.fb ? `<section class="sl" data-t="Feedback form"><div class="wrap">
  <h2>Feedback form</h2>
  <p class="lead">${esc(d.fbLead || 'Fill it in, and Mike will give you feedback on your deck.')}</p>
  <ol class="pts"><li>Check your deck is in your shared folder, shared with Mike.</li><li>Fill in the form. It takes two minutes.</li><li>Mike leaves feedback right in your deck, as comments.</li></ol>
  ${FEEDBACK_FORM[d.fb] ? `<p class="fbgo"><a href="${FEEDBACK_FORM[d.fb]}" target="_blank" rel="noopener">Open the feedback form</a></p><p class="fburl">${esc(FEEDBACK_FORM[d.fb].replace(/^https:\/\//, ''))}</p>` : '<p class="none-yet">Your tutor shares the link in the room.</p>'}
  <p class="src">Optional. For the next two weeks it is also in the top bar of every page, as <b>Feedback form</b>.</p>
</div></section>` : ''}
<section class="sl" data-t="${esc(d.last.t)}"><div class="wrap">
  <h2>${esc(d.last.t)}</h2>
  ${d.last.body}
</div></section>`;
  DK.start();
})();
</script>
