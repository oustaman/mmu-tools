<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three teardowns — Screen Design, week 1</title>
<style>
  :root{
    --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#EDEBE8;
    --ink:#1A1618; --ink-2:#56504F; --ink-3:#8B8382;
    --line:#DFDBD7; --line-2:#C9C3BE;
    --lec:#8C2437; --lec-soft:#F6E8EA;
    --wsh:#1D5C7A; --wsh-soft:#E4EEF3;
    --ok:#2C5F3E; --ok-soft:#E3EFE7;
    --warn:#8A5D05; --warn-soft:#F4EAD3;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#151314; --surface:#1E1B1C; --surface-2:#262223;
    --ink:#EDE9E7; --ink-2:#B5AEAB; --ink-3:#847C79;
    --line:#332E2F; --line-2:#463F40;
    --lec:#E08A9B; --lec-soft:#332226; --wsh:#7FBEDC; --wsh-soft:#16262E;
    --ok:#7FBF97; --ok-soft:#1C2A22; --warn:#DCB469; --warn-soft:#2A2417;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}

  /* The header every page in the module carries (copied, not shared — these open
     from a Moodle download as often as from a server). */
  .wrap{max-width:1100px;margin:0 auto;padding-inline:22px}
  header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:40}
  .bar{display:flex;align-items:center;gap:10px;padding-block:11px;flex-wrap:nowrap}
  .brand{font-weight:680;font-size:1rem;letter-spacing:-0.015em;white-space:nowrap;color:inherit;
    text-decoration:none;padding:5px 8px;margin-left:-8px;border-radius:6px}
  .brand:hover{background:var(--surface-2)}
  .sp{flex:1}
  .navl{font-size:0.85rem;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
  .navl:hover{background:var(--surface-2);color:var(--ink)}
  .navl.on{background:var(--lec);color:#fff}
  [data-theme="dark"] .navl.on{color:#151314}
  .ctl button{font-family:var(--mono);font-size:0.7rem;background:none;color:var(--ink-3);
    border:1px solid var(--line-2);border-radius:5px;padding:5px 8px;cursor:pointer;line-height:1}
  .ctl button:hover{border-color:var(--lec);color:var(--lec)}
  @media(max-width:760px){ header .bar{gap:6px} .navl{padding:6px 8px;font-size:0.82rem} }
  @media(max-width:560px){
    header .bar{flex-wrap:wrap;row-gap:6px}
    header .brand{order:0} header .ctl{order:1;margin-left:auto}
    header .bar > .sp{order:2;flex-basis:100%;height:0}
    header .navl{order:3;padding:5px 7px;font-size:0.78rem}
  }
  @media(max-width:420px){.wrap{padding-inline:14px}}

  .tools{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--hdr,55px);z-index:39}
  .tbar{display:flex;align-items:center;gap:8px;padding-block:8px}
  .tbar b{font-size:0.9rem;letter-spacing:-0.01em;white-space:nowrap}
  .tbar select{font-family:var(--mono);font-size:0.72rem;color:var(--ink-2);background:var(--surface);
    border:1px solid var(--line-2);border-radius:8px;padding:0 8px;min-height:36px;max-width:240px;min-width:0}
  /* the view switch shows pictures, not words: a page to read, an easel to present */
  .vico{display:block;margin:auto}
  .viewsw button{min-width:46px}
  .viewsw{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
  .viewsw button,.tbtn{font-family:var(--mono);font-size:0.74rem;background:var(--surface);color:var(--ink-2);
    border:0;padding:0 12px;min-height:36px;cursor:pointer}
  .viewsw button + button{border-left:1px solid var(--line-2)}
  .viewsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .tbtn{border:1px solid var(--line-2);border-radius:8px;flex:none}
  .tbtn:disabled{opacity:.35;cursor:default}
  .tbtn:hover:not(:disabled),.viewsw button:hover:not([aria-pressed="true"]){color:var(--lec)}
  @media(max-width:700px){
    .tbar{flex-wrap:wrap;row-gap:6px}
    .tbar b{width:100%}
    .tbar .sp{display:none}
    .tbar select{flex:1 1 90px;max-width:none;min-height:40px}
    .viewsw button,.tbtn{min-height:40px}
    .tnav{display:none}
  }

  /* Scroll is the default: each teardown is a section of one page, a full
     screen tall on anything wider than a phone so a screenshot still gets the
     room it gets on a projector. Slides (html.deck) is the lecture view. */
  html.deck,html.deck body{height:100%}
  html.deck body{display:flex;flex-direction:column;overflow:hidden}
  html.deck .tools{position:static}

  .top{display:flex;align-items:center;gap:12px;padding:9px 20px;border-bottom:1px solid var(--line);
    background:var(--surface);flex:none}
  .top b{font-size:0.9rem;letter-spacing:-0.01em}
  .top .sp{flex:1}
  .top a,.top button{font-family:var(--mono);font-size:0.7rem;color:var(--ink-3);text-decoration:none;
    background:none;border:0;cursor:pointer;padding:4px 7px;border-radius:5px}
  .top a:hover,.top button:hover{background:var(--surface-2);color:var(--ink)}
  .top button:disabled{opacity:.3}
  .top select{font-family:var(--mono);font-size:0.7rem;color:var(--ink-2);background:var(--surface);
    border:1px solid var(--line);border-radius:5px;padding:3px 6px;max-width:230px}
  .top a.on{color:var(--lec)}

  .stage{min-width:0}
  .slide{position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:min(3.4vh,26px) min(3vw,34px);border-bottom:1px solid var(--line);
    height:calc(100vh - var(--hdr,55px) - var(--tls,53px));min-height:560px;
    scroll-margin-top:calc(var(--hdr,55px) + var(--tls,53px))}
  html.deck .body{flex:1;display:flex;min-height:0}
  html.deck .stage{flex:1;position:relative}
  html.deck .slide{position:absolute;inset:0;display:none;height:auto;min-height:0;border:0;overflow:hidden}
  html.deck .slide.active{display:flex}
  /* On a phone a landscape screenshot is small however tall the section is, so
     sections size to their content and the picture takes the full width. */
  @media(max-width:700px){
    .slide{height:auto;min-height:0;padding:26px 16px}
    .shot .pic{flex:none}
    .shot .pic img{width:100%;max-height:none}
    /* two columns of comment are two 170px columns on a phone */
    .cols{grid-template-columns:1fr !important}
    .cols.one .say{columns:auto !important}  /* the base rule sits later in the file */
    html.deck .slide{overflow:auto}
  }
  .slide h2{margin:0 0 14px;font-size:clamp(1.5rem,3.4vw,2.5rem);letter-spacing:-0.028em;
    line-height:1.12;font-weight:700;max-width:22ch}
  .slide .lead{margin:0;font-size:clamp(1rem,1.7vw,1.28rem);color:var(--ink-2);
    line-height:1.5;max-width:60ch}
  .slide .lead b{color:var(--ink)}
  .eyebrow{font-family:var(--mono);font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 12px}
  .meta{font-family:var(--mono);font-size:0.7rem;color:var(--ink-3);margin-top:18px;line-height:1.6}
  .foot{margin-top:auto;padding-top:16px;font-size:0.86rem;color:var(--ink-3);
    border-top:1px solid var(--line);line-height:1.5;max-width:76ch}

  /* A captured step. The picture is the slide — it gets every pixel that the
     heading and the two columns of comment do not need, because a screenshot
     nobody can read from row 20 of a lecture theatre teaches nothing. The lens
     carries the detail; the yellow ring says where to look. */
  .shot{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
  .shot .head{flex:none;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .shot .head .eyebrow{margin:0}
  .shot h2{margin:0;font-size:clamp(1.05rem,2vw,1.6rem);max-width:none;line-height:1.15}
  .shot .pic{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .shot .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block;
    border:1px solid var(--line-2);border-radius:4px;box-shadow:0 6px 30px rgba(0,0,0,.22);background:#fff}

  /* where the capture came from, and a way to go and look */
  .srcline{flex:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-family:var(--mono);font-size:0.66rem;color:var(--ink-3);padding-top:6px}
  .srcline a{color:var(--lec);text-decoration:none;border-bottom:1px solid currentColor}
  .srcline a:hover{background:var(--lec-soft)}
  .srcline .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .srcline .warn{color:var(--warn)}
  .flowcard .go{display:inline-block;margin-top:14px;font-family:var(--mono);font-size:0.8rem;
    color:var(--lec);text-decoration:none;border-bottom:1px solid currentColor}
  .flowcard .go:hover{background:var(--lec-soft)}

  /* the comment, in two columns under the picture */
  .cols{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.6vw,40px);
    padding-top:10px;border-top:1px solid var(--line)}
  /* With no second note the right column would sit empty, so the one comment
     flows across both instead of hugging the left half. */
  .cols.one{display:block}
  .cols.one .say{columns:2;column-gap:clamp(16px,2.6vw,40px)}
  .cols .say{margin:0;font-size:clamp(0.86rem,1.18vw,1.05rem);color:var(--ink-2);line-height:1.5}
  .cols .say b{color:var(--ink)}
  .cols .foot{margin:0;padding:0;border:0;font-size:clamp(0.78rem,1.02vw,0.92rem);
    color:var(--ink-3);line-height:1.5}
  @media(max-width:820px){
    .cols{grid-template-columns:1fr;gap:8px}
    .shot .pic img{max-height:52vh}
  }

  /* the notice, set the way the service sets it */
  .notice{border-left:6px solid var(--ink);background:var(--surface);padding:22px 26px;
    margin:6px 0 20px;max-width:42ch;display:flex;gap:16px;align-items:flex-start}
  .notice .warn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);
    display:grid;place-items:center;font-weight:800;font-size:1.4rem;line-height:1}
  .notice q{quotes:none;font-size:clamp(1.05rem,2.1vw,1.55rem);font-weight:700;line-height:1.35;
    letter-spacing:-0.012em}
  .cite{font-family:var(--mono);font-size:0.68rem;color:var(--ink-3);margin:0 0 18px}
  .noticewrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);
    align-items:center;flex:1;min-height:0}
  @media(max-width:900px){ .noticewrap{grid-template-columns:1fr;overflow:auto} }

  ul.pts{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;max-width:62ch}
  ul.pts li{font-size:clamp(0.95rem,1.5vw,1.14rem);color:var(--ink-2);line-height:1.45;
    padding-left:26px;position:relative}
  ul.pts li::before{content:"→";position:absolute;left:0;color:var(--lec);font-weight:700}

  .flowcard{border:1px solid var(--line);border-left:5px solid var(--lec);background:var(--surface);
    border-radius:12px;padding:clamp(20px,3vw,34px);max-width:62ch}

  .pn{position:absolute;right:14px;bottom:10px;font-family:var(--mono);font-size:0.68rem;color:var(--ink-3)}

  /* The top bar is six links and two buttons on one line; below ~600px that is
     wider than the phone. Let it wrap, and drop the section links — the TOC is
     hidden at this width anyway, so they navigate by arrow keys or swipe. */


  @media print{
    body{overflow:visible;height:auto;display:block}
    header,.tools,.toc,.pn{display:none}
    .stage{position:static}
    .slide,html.deck .slide{position:static;display:flex!important;height:100vh;page-break-after:always;border:0}
  }

  /* Two slides are redrawn rather than captured: the publishers of those pages
     licence nothing, and both slides argue from scale and position, which a
     redrawing carries exactly. Always labelled, and the live page always linked
     — a drawing presented as a capture would be the one thing this deck is
     teaching students not to do. */
  .redraw{position:relative;margin:0;background:#fff;border:1px solid var(--line-2);border-radius:4px;
    box-shadow:0 6px 30px rgba(0,0,0,.22);width:100%;max-width:960px;
    padding:0;font-family:var(--sans,system-ui,sans-serif);
    transform:scale(var(--rd-scale,1));transform-origin:center top}
  .rdtag{position:absolute;top:0;right:0;z-index:2;font-family:var(--mono);font-size:.6rem;
    letter-spacing:.09em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);
    border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 9px}
  .rdwhy{flex:none;font-size:.72rem;line-height:1.5;color:var(--ink-3);padding-top:6px;max-width:88ch}
  .rdwhy b{color:var(--ink-2)}
  .rd{color:var(--ink);text-align:left}
  .rd h3{font-size:.9rem;line-height:1.22;margin:6px 0 0;font-weight:700}

  .rd-news{padding:0 0 15px}
  .rd-mast{display:flex;align-items:baseline;gap:22px;border-bottom:3px solid var(--ink);
    padding:10px 18px 8px;margin-bottom:12px}
  .rd-mast span{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:#B8171F}
  .rd-mast nav{display:flex;gap:15px}
  .rd-mast i{font-style:normal;font-size:.74rem;color:var(--ink-2)}
  .rd-grid{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;padding:0 18px}
  /* Short, wide placeholders: the slide has to fit a projector, and the point
     is the ratio between the lead and the rest, not the size of a photograph. */
  .rd-img{background:var(--surface-2);border:1px solid var(--line);aspect-ratio:2.9/1}
  .rd-img.rd-sm{aspect-ratio:3.4/1}
  .rd-lead h3{font-size:1.55rem;line-height:1.12;letter-spacing:-.02em;margin-top:10px}
  .rd-lead p{font-size:.84rem;color:var(--ink-2);margin:7px 0 0;line-height:1.4}
  .rd-side{display:flex;flex-direction:column;gap:11px}
  .rd-side h3{font-size:.86rem}
  .rd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:13px 18px 0;
    margin-top:13px;border-top:1px solid var(--line)}
  .rd-row h3{font-size:.8rem;margin:0}

  .rd-shop{padding:0 0 20px}
  .rd-crumb{font-size:.7rem;color:var(--ink-3);padding:11px 18px;border-bottom:1px solid var(--line)}
  .rd-cols{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;padding:18px}
  .rd-photo{background:var(--surface-2);border:1px solid var(--line);aspect-ratio:1}
  .rd-brand{font-weight:700;font-size:1rem;margin:0;letter-spacing:.01em}
  .rd-price{margin:9px 0 0;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .rd-price sup{font-size:1rem;top:-.7em}
  .rd-price span{font-size:.62rem;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
  /* the whole argument of the slide: this block sits above the button */
  .rd-fulfil{border:2px solid var(--ink);padding:11px 13px;margin:16px 0 14px}
  .rd-fl{margin:0 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .rd-fulfil label{display:flex;align-items:center;gap:8px;font-size:.84rem;padding:3px 0}
  .rd-cta{display:block;width:100%;background:#0B7A3B;color:#fff;border:0;border-radius:3px;
    padding:13px;font:700 .95rem var(--sans,system-ui,sans-serif);cursor:default}
  .rd-note{margin:11px 0 0;font-size:.76rem;color:var(--wsh);text-decoration:underline}
  @media (max-width:900px){.rd-grid,.rd-cols{grid-template-columns:1fr}
    .rd-row{grid-template-columns:repeat(2,1fr)}.rd-lead h3{font-size:1.4rem}}
  </style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">Screen Design</a>
    <span class="sp"></span>
    <a class="navl" href="index.html">Weeks</a><a class="navl on" href="weeks.html">Materials</a><a class="navl" href="brief.html">The brief</a><a class="navl" href="assessment.html">What to hand in</a>
    <span class="ctl"><button id="theme" aria-label="Dark mode">◐</button></span>
  </div>
</header>
<div class="tools">
  <div class="wrap tbar">
    <b>Three teardowns</b>
    <span class="sp"></span>
    <select id="jump" title="Jump to a slide"></select>
    <span class="viewsw" role="group" aria-label="How to show the deck">
      <button type="button" data-view="scroll" aria-pressed="true" aria-label="Read as a page" title="Read as a page"><svg class="vico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 9h2M9 13h6M9 17h6"/></svg></button>
      <button type="button" data-view="deck" aria-pressed="false" aria-label="Show as slides" title="Show as slides"><svg class="vico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h19"/><rect x="4" y="3.5" width="16" height="11.5" rx="1"/><path d="M7.5 11.5l2.8-2.8 2.4 2 3.8-3.9"/><path d="M12 15v3.2M12 18.2 8 21.5M12 18.2l4 3.3"/></svg></button>
    </span>
    <button type="button" class="tbtn tnav" id="prev" title="Previous">‹</button>
    <button type="button" class="tbtn tnav" id="next" title="Next">›</button>
    <button type="button" class="tbtn" id="print">Print</button>
  </div>
</div>

<div class="body">
  <div class="stage" id="stage"></div>
</div>

<script src="teardown-data.js"></script>
<script>
const stage = document.getElementById('stage'), toc = document.getElementById('toc');

function render(s, i){
  const pn = `<span class="pn">${i + 1} / ${TEARDOWNS.length}</span>`;
  const foot = s.foot ? `<p class="foot">${s.foot}</p>` : '';
  switch (s.k) {
    case 'title':
      return `<p class="eyebrow">Week 1 · shown in class</p><h2>${s.h}</h2>
              <p class="lead">${s.lead}</p>${foot}${pn}`;
    case 'text':
      return `<p class="eyebrow">${s.n}</p><h2>${s.h}</h2><p class="lead">${s.lead}</p>${foot}${pn}`;
    case 'flow':
      return `<div class="flowcard"><p class="eyebrow">The flow</p><h2>${s.h}</h2>
              <p class="lead">${s.lead}</p><p class="meta">${s.meta}</p>
              ${s.link ? `<a class="go" href="${s.link.href}" target="_blank" rel="noopener">${s.link.text} →</a>` : ''}
              </div>${pn}`;
    case 'shot':
      return `<div class="shot">
        <div class="head"><p class="eyebrow">${s.n}</p><h2>${s.h}</h2></div>
        <div class="pic">
          ${s.redraw
            ? `<figure class="redraw"><span class="rdtag">redrawn, not a capture</span>
                 ${s.redraw}</figure>`
            : `<img src="${s.img}" alt="${s.n}">`}
        </div>
        ${s.redrawWhy ? `<p class="rdwhy"><b>Why this one is a drawing.</b> ${s.redrawWhy}</p>` : ''}
        ${s.src ? `<p class="srcline">
          <span class="u">${s.src.url}</span>
          <a href="${s.src.live}" target="_blank" rel="noopener">open it live →</a>
          ${s.src.deep === false ? '<span class="warn">· this step is inside a session, so the link opens the start of the service</span>' : ''}
        </p>` : ''}
        <div class="cols${s.foot ? '' : ' one'}"><p class="say">${s.say}</p>
          ${s.foot ? `<p class="foot">${s.foot}</p>` : ''}</div>
      </div>${pn}`;
    case 'notice':
      return `<div class="noticewrap">
        <div><p class="eyebrow">The notice</p><h2>${s.h}</h2>
          <div class="notice"><span class="warn">!</span><q>${s.quote}</q></div>
          <p class="cite">${s.cite}</p></div>
        <div><p class="say lead">${s.say}</p></div></div>${foot}${pn}`;
    case 'close':
      return `<p class="eyebrow">${s.n}</p><h2>${s.h}</h2><p class="lead">${s.lead}</p>
              <ul class="pts">${s.bullets.map(b => `<li>${b}</li>`).join('')}</ul>${foot}${pn}`;
  }
  return '';
}

stage.innerHTML = TEARDOWNS.map((s, i) => `<section class="slide" id="sl${i}">${render(s, i)}</section>`).join('');

const jump = document.getElementById('jump');
jump.innerHTML = TEARDOWNS.map((s, i) =>
  `<option value="${i}">${String(i + 1).padStart(2, '0')} · ${s.n}</option>`).join('');

/* The lens is the same image at `zoom`, cropped to a circle and centred on the
   focus point, so a detail that is 14px on the slide is legible from the back
   of a lecture theatre. Everything is measured off the image's REAL rendered
   box — object-fit:contain letterboxes it, so the box is not the container. */
let cur = 0;
const root = document.documentElement;
const slides = [...document.querySelectorAll('.slide')];
const isDeck = () => root.classList.contains('deck');
let settling = true;                           // see land()
try { history.scrollRestoration = 'manual'; } catch(e){}

function measure(){
  root.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
  root.style.setProperty('--tls', document.querySelector('.tools').offsetHeight + 'px');
}
function mark(i){
  cur = Math.max(0, Math.min(TEARDOWNS.length - 1, i));
  jump.value = cur;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === TEARDOWNS.length - 1;
  /* replaceState, not location.hash: assigning the hash adds a history entry per
     slide and makes the browser try to scroll to an element called s3. */
  try { history.replaceState(null, '', location.pathname + location.search + '#s' + (cur + 1)); } catch(e){}
}
function show(i, smooth){
  mark(i);
  if (isDeck()) {
    slides.forEach((el, k) => el.classList.toggle('active', k === cur));
  } else {
    quiet();
    slides[cur].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  }
  fitRedraws();
}

/* A jump scrolls smoothly past every section in between, and the observer
   would mark each one on the way — switching to slides mid-flight landed on
   the wrong one. It is quiet until the scroll ends. */
let quietTimer;
function quiet(){
  settling = true;
  clearTimeout(quietTimer);
  quietTimer = setTimeout(() => { settling = false; }, 1500);
}
addEventListener('scrollend', () => { clearTimeout(quietTimer); setTimeout(() => { settling = false; }, 60); });

function setView(v){
  root.classList.toggle('deck', v === 'deck');
  document.querySelectorAll('.viewsw button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  const q = new URLSearchParams(location.search);
  v === 'deck' ? q.set('view', 'slides') : q.delete('view');
  const qs = q.toString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + '#s' + (cur + 1)); } catch(e){}
  measure();
  show(cur);
}
document.querySelector('.viewsw').onclick = e => {
  const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view);
};

/* A redrawn slide is a fixed layout, not a picture, so it cannot letterbox the
   way object-fit does for the captures. It is drawn at its natural size and
   then scaled down to whatever the room's projector actually gives us —
   measured, because tuning the numbers until it fitted one viewport is how you
   get a slide that clips on the machine in the lecture theatre. In scroll view
   every section is on the page at once, so every drawing is fitted. */
function fitRedraws(){
  const sel = isDeck() ? '.slide.active .redraw' : '.slide .redraw';
  document.querySelectorAll(sel).forEach((r) => {
    r.style.setProperty('--rd-scale', '1');
    r.style.marginBottom = '0px';
    const box = r.parentElement;
    const avail = box.clientHeight, natural = r.offsetHeight;
    const k = (avail && natural > avail) ? Math.max(0.55, avail / natural) : 1;
    r.style.setProperty('--rd-scale', String(k));
    /* transform does not change layout, so the box would still reserve its full
       height and the flex centring would push the drawing up over the heading.
       Pull the reserved height down to the drawn height. */
    r.style.marginBottom = k < 1 ? `${-Math.round(natural * (1 - k))}px` : '0px';
  });
}

const seen = new IntersectionObserver(entries => {
  if (isDeck() || settling) return;
  const top = entries.filter(e => e.isIntersecting)
    .sort((x, y) => x.boundingClientRect.top - y.boundingClientRect.top)[0];
  if (top) mark(slides.indexOf(top.target));
}, { rootMargin: '-35% 0px -55% 0px' });
slides.forEach(el => seen.observe(el));

addEventListener('resize', () => { measure(); fitRedraws(); });
jump.addEventListener('change', () => show(+jump.value, true));
document.getElementById('prev').onclick = () => show(cur - 1, true);
document.getElementById('next').onclick = () => show(cur + 1, true);
addEventListener('keydown', e => {
  if (!isDeck() || e.target.tagName === 'SELECT') return;
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (['ArrowLeft','PageUp'].includes(e.key))        { e.preventDefault(); show(cur - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End')  show(TEARDOWNS.length - 1);
});
addEventListener('hashchange', () => {
  const n = parseInt(location.hash.replace('#s', ''), 10);
  if (Number.isFinite(n) && n - 1 !== cur) show(n - 1);
});
document.getElementById('print').onclick = () => print();

/* the same theme memory as every other page */
try { const t = localStorage.getItem('sd-theme'); if (t) root.setAttribute('data-theme', t); } catch(e){}
if (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme', 'dark');
document.getElementById('theme').onclick = () => {
  const d = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', d);
  try { localStorage.setItem('sd-theme', d); } catch(e){}
};

cur = Math.max(0, Math.min(TEARDOWNS.length - 1, (parseInt(location.hash.replace('#s', ''), 10) || 1) - 1));
setView(new URLSearchParams(location.search).get('view') === 'slides' ? 'deck' : 'scroll');
function land(){
  measure();
  show(cur);
  setTimeout(() => { settling = false; }, 300);
}
document.readyState === 'complete' ? land() : addEventListener('load', land);
</script>
</body>
</html>
