<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twenty screens, cheatsheet — Screen Design</title>
<link rel="stylesheet" href="paper.css?v=202611092021">
<style>
  .cs{display:grid;grid-template-columns:repeat(5,1fr);gap:5mm 5mm}
  .cs-i{display:flex;flex-direction:column;gap:1.6mm}
  .cs-i .mini{--u:0.06mm}
  .cs-i .mini .canvas{border-width:0.35mm;border-radius:2.5mm}
  .cs-k{font-size:6.5pt;letter-spacing:.1em;text-transform:uppercase;color:#7A7372}
  .cs-n{font-size:10pt;font-weight:700;margin:0;line-height:1.15}
  .cs-d{font-size:7.5pt;color:#514B4A;margin:0;line-height:1.35}
  .cs-r{font-size:6.8pt;color:#7A7372;margin:0;line-height:1.4} .cs-r b{color:#514B4A;font-weight:700;white-space:nowrap}
  .ix{columns:4;column-gap:7mm;font-size:7.6pt;line-height:1.4}
  .ix p{margin:0 0 1.6mm;break-inside:avoid} .ix b{color:#1A1618} .ix span{color:#7A7372}
  h1.ch{font-size:16pt;margin:0 0 1mm} p.chs{font-size:8.5pt;color:#514B4A;margin:0 0 5mm;max-width:250mm}
</style>
</head>
<body>
<div class="toolbar noprint"><b>Twenty screens · cheatsheet</b><span>A4 landscape</span><button type="button" onclick="print()">Print</button></div>
<main id="pages"></main>
<script src="paper-kit.js?v=202611092021"></script>
<script src="organisms.js?v=202611092021"></script>
<script>
/* The taxonomy on paper: every kind of screen, what it does, and the organisms it is usually
   built from (drawn small, in order). Then the other way round: where each organism turns up.
   All of it is read from organisms.js. */
const { ARCHETYPES: A, BY, USED, screen } = window.ORG;
const O = window.ORG.O.filter(o => !o.desk);
const foot = `<div class="foot"><span>Screen Design · Twenty screens · a usual recipe, not a rule: swap, add or drop organisms to fit your journey</span><span></span></div>`;
const card = a => `<div class="cs-i"><span class="cs-k">${a.id}</span><p class="cs-n">${a.name}</p><p class="cs-d">${a.does}</p>
  <div class="mini">${screen(a.recipe, { label: false, slots: false })}</div>
  <p class="cs-r">${a.recipe.map(id => `<b>${BY[id].code}</b> ${BY[id].name}`).join(' · ')} — ${a.rows} of 14 rows, ${a.rows * 56} px</p></div>`;
let html = '';
for (let i = 0; i < A.length; i += 10)
  html += `<section class="page land">${i === 0 ? `<h1 class="ch">Twenty screens, and what they are made of</h1>
    <p class="chs">Most journeys are four to six of these. Each is shown with the organisms it is usually built from, top to bottom.
    It is a starting point: swap, add or drop organisms until the screen does its one job for your user.</p>` : ''}
    <div class="cs">${A.slice(i, i + 10).map(card).join('')}</div>${foot}</section>`;
html += `<section class="page land"><h1 class="ch">Where each organism turns up</h1>
  <p class="chs">The same organism does different jobs on different screens: a list is the whole of a Search, and one part of a Home Tab. Nothing fits? Use a blank piece, OWN-01 to OWN-06, one for each height in rows, and name it.</p>
  <div class="ix">${['Top', 'Headings', 'Search', 'Answers', 'Content', 'Feedback', 'Actions', 'Overlay'].map(f =>
    O.filter(o => o.fam === f).map(o => `<p><b>${o.code} ${o.name}</b> <span>${o.size}</span><br>${USED[o.id].length
      ? USED[o.id].map(id => A.find(a => a.id === id).name.replace(/^The /, '')).join(', ') : o.over ? '<span>Over any screen, where it would appear</span>' : '<span>Not in a recipe yet: use it where it fits</span>'}</p>`).join('')).join('')}</div>${foot}</section>`;
document.getElementById('pages').innerHTML = html;
</script>
</body>
</html>
