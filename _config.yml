# GitHub Pages builds this repository with Jekyll. This file exists for one
# reason: files that live in the Screen Design working branch but must not be
# served. modules/sd is published by copying the folder from that branch, so
# deleting them from main is not enough on its own — the next publish would
# bring them back. Listed here, they are never served even if they are copied.
#
#   the module specification and three superseded drafts of the brief;
#   the only Word document students get is the current 2026-27 brief.
exclude:
  - modules/sd/ScreenDesign202627-ModuleSpecification.docx
  - modules/sd/Screen_Design_Assessment_Brief_CAF.2025-26.original.docx
  - modules/sd/Screen_Design_Assessment_Brief_CAF.docx
  - modules/sd/screen-design.docx
